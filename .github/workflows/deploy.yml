name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stuartmemo-production
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source and components
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build document root
        run: ./scripts/build-site.sh

      - name: Verify document root
        run: ./scripts/verify-site.sh

      - name: Check deployment configuration
        if: github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure deployment SSH identity
        if: github.ref == 'refs/heads/master'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/stuartmemo_deploy"
          chmod 0600 "$HOME/.ssh/stuartmemo_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Upload immutable release
        if: github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C _site -czf - . | ssh \
            -i "$HOME/.ssh/stuartmemo_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "upload $release_id"
          printf 'RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Activate release
        if: github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/stuartmemo_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "activate $RELEASE_ID"

      - name: Verify production release
        if: github.ref == 'refs/heads/master'
        run: |
          for attempt in {1..10}; do
            deployed_sha="$(curl --fail --silent --show-error \
              "https://stuartmemo.com/.well-known/stuartmemo-release?run=$GITHUB_RUN_ID" || true)"
            if [[ "$deployed_sha" == "$GITHUB_SHA" ]]; then
              curl --fail --silent --show-error --output /dev/null https://stuartmemo.com/
              exit 0
            fi
            sleep 2
          done
          echo "Production did not report the expected commit." >&2
          exit 1
